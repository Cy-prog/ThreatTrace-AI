spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/threattrace_db}
    username: ${DB_USER:threattrace_user}
    password: ${DB_PASSWORD:threattrace_secure_pass_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.threattrace: INFO
    org.springframework.security: WARN
