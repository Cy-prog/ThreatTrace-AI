version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: threattrace-dev-postgres
    environment:
      POSTGRES_DB: threattrace_db
      POSTGRES_USER: threattrace_user
      POSTGRES_PASSWORD: threattrace_dev_password_123
    ports:
      - "5432:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: threattrace-dev-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  dev_pgdata:
