services:
  # 1. AI Intelligence Microservice (FastAPI / Scikit-Learn)
  - type: web
    name: threattrace-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

  # 2. Backend API Gateway & Core Engine (Spring Boot 3 / Java 21)
  - type: web
    name: threattrace-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SERVER_PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: threattrace-db
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: threattrace-ai-service
          property: hostport
      - key: AI_SERVICE_API_KEY
        fromService:
          type: web
          name: threattrace-ai-service
          envVarKey: API_KEY

databases:
  # Managed PostgreSQL Database
  - name: threattrace-db
    databaseName: threattrace_db
    user: threattrace_user
    plan: free
    region: oregon
